[project]
name = "portflow-cli"
version = "0.1.0"
description = "Portflow on-site CLI: capture LLDP, record patchpanel↔switch links, sync to Portflow API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Portflow" }]
dependencies = [
    "scapy>=2.5.0",
    "requests>=2.31.0",
    "questionary>=2.0.1",
    "rich>=13.7.0",
    "platformdirs>=4.2.0",
    "keyring>=24.3.0; platform_system != 'Linux'",
]

[project.scripts]
pfcli = "portflow_cli.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["portflow_cli*"]
