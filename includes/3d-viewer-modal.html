<!-- 3D Rack View Modal (wird in detailsPopup eingefügt als neuer Tab) -->
<div id="view3dTab" class="hidden space-y-4 p-4">
    <div class="mb-4 flex items-center justify-between">
        <h2 class="text-xl font-bold text-slate-900">3D Rack-Ansicht</h2>
        <button 
            type="button" 
            onclick="close3DView()" 
            class="inline-flex h-8 w-8 items-center justify-center rounded-full bg-slate-200 text-slate-600 transition hover:bg-slate-300"
            title="Schließen"
        >
            <i data-lucide="x" class="h-4 w-4"></i>
        </button>
    </div>
    
    <div id="viewer3dContainer" class="h-[60vh] w-full rounded-lg border border-slate-300 bg-slate-50 shadow-sm">
        <!-- Three.js Viewer wird hier eingefügt -->
    </div>
    
    <div class="grid gap-3 md:grid-cols-3">
        <label class="flex flex-col gap-1 text-sm">
            <span class="font-semibold text-slate-700">Overlay-Metrik</span>
            <select id="viewer3dMetric" class="rounded-lg border border-slate-300 bg-white px-3 py-2" onchange="change3DMetric(this.value)">
                <option value="weight">Gewicht (kg)</option>
                <option value="power">Power (W)</option>
                <option value="thermal">Thermal (W)</option>
            </select>
        </label>
        
        <label class="flex items-end gap-2">
            <input type="checkbox" id="viewer3dPortsToggle" checked onchange="toggle3DFeature('ports', this.checked)" class="h-4 w-4">
            <span class="text-sm font-semibold text-slate-700">Ports anzeigen</span>
        </label>
        
        <label class="flex items-end gap-2">
            <input type="checkbox" id="viewer3dCablesToggle" checked onchange="toggle3DFeature('cables', this.checked)" class="h-4 w-4">
            <span class="text-sm font-semibold text-slate-700">Kabel anzeigen</span>
        </label>
    </div>
    
    <div id="viewer3dStatus" class="rounded-lg border border-slate-200 bg-slate-50 p-3 text-sm text-slate-600">
        Viewer wird initialisiert...
    </div>
</div>

<script type="module">
    import { PortflowViewer3D } from './js/PortflowViewer3D.js';
    
    let viewer3dInstance = null;
    let current3DLocationUuid = null;
    
    /**
     * Öffnet die 3D-Ansicht für einen Rack (Location)
     */
    window.open3DView = async function(locationUuid) {
        current3DLocationUuid = locationUuid;
        
        // Tab anzeigen
        const tab = document.getElementById('view3dTab');
        if (tab) {
            tab.classList.remove('hidden');
            
            // Vorherigen Viewer aufräumen
            if (viewer3dInstance) {
                viewer3dInstance.destroy();
            }
            
            // Neuen Viewer erstellen
            viewer3dInstance = new PortflowViewer3D('#viewer3dContainer', {
                apiUrl: './api/',
                width: document.getElementById('viewer3dContainer').clientWidth,
                height: 600,
                onStatus: (msg, isError) => {
                    const statusEl = document.getElementById('viewer3dStatus');
                    if (statusEl) {
                        statusEl.textContent = msg;
                        statusEl.className = `rounded-lg border p-3 text-sm ${isError 
                            ? 'border-red-300 bg-red-50 text-red-700' 
                            : 'border-slate-200 bg-slate-50 text-slate-600'}`;
                    }
                }
            });
            
            // Rack laden
            try {
                await viewer3dInstance.loadRack(locationUuid);
            } catch (err) {
                console.error('Failed to load 3D view:', err);
                const statusEl = document.getElementById('viewer3dStatus');
                if (statusEl) {
                    statusEl.textContent = `Fehler: ${err.message}`;
                    statusEl.className = 'rounded-lg border border-red-300 bg-red-50 p-3 text-sm text-red-700';
                }
            }
        }
    };
    
    /**
     * Schließt die 3D-Ansicht
     */
    window.close3DView = function() {
        const tab = document.getElementById('view3dTab');
        if (tab) {
            tab.classList.add('hidden');
        }
        if (viewer3dInstance) {
            viewer3dInstance.destroy();
            viewer3dInstance = null;
        }
        current3DLocationUuid = null;
    };
    
    /**
     * Ändert die Overlay-Metrik
     */
    window.change3DMetric = function(metric) {
        if (viewer3dInstance) {
            viewer3dInstance.setOverlayMetric(metric);
        }
    };
    
    /**
     * Toggle für Features
     */
    window.toggle3DFeature = function(feature, enabled) {
        if (!viewer3dInstance) return;
        
        switch(feature) {
            case 'ports':
                viewer3dInstance.state.showPorts = enabled;
                break;
            case 'cables':
                viewer3dInstance.state.showCables = enabled;
                break;
        }
        viewer3dInstance._invalidateCache?.();
    };
</script>
